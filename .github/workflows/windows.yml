name: Windows runtime checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  native-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Validate Windows bootstrap scripts
        shell: powershell
        run: |
          .\scripts\setup-windows.ps1 -DryRun
          .\scripts\activate-windows.ps1 -DryRun
      - name: Install and smoke-test local Windows runtime
        shell: powershell
        run: |
          .\scripts\setup-windows.ps1 -LocalOnly
          $health = Invoke-RestMethod http://127.0.0.1:8791/health
          if ($health.runtime -ne 'catkov') { throw 'Local bootstrap smoke failed' }
          Write-Host 'WINDOWS BOOTSTRAP SMOKE PASSED'
      - name: Bootstrap failure diagnostics
        if: failure()
        shell: powershell
        run: |
          $d = Join-Path $env:LOCALAPPDATA 'catkov'
          Get-Content (Join-Path $d 'mcp.log') -Tail 45 -ErrorAction SilentlyContinue
          Get-ChildItem $d -ErrorAction SilentlyContinue | Select-Object Name,Length
